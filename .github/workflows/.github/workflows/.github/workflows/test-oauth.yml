name: Test OAuth 1.0

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Test OAuth
      env:
        X_API_KEY: ${{ secrets.X_API_KEY }}
        X_API_SECRET: ${{ secrets.X_API_SECRET }}
        X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
        X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      run: |
        echo "===== OAuth 1.0 测试 ====="
        if [ -z "$X_API_KEY" ]; then
          echo "❌ X_API_KEY 未设置"
          exit 1
        fi
        echo "✅ 所有 OAuth credentials 已设置"
        echo ""
        echo "🔧 现在运行实际测试脚本..."
        # 这里运行实际的 Node.js 测试脚本
