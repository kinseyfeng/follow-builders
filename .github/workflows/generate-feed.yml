name: Generate Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: |
        cd scripts
        npm install
    
    - name: Generate feed (OAuth 1.0)
      env:
        X_API_KEY: ${{ secrets.X_API_KEY }}
        X_API_SECRET: ${{ secrets.X_API_SECRET }}
        X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
        X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        POD2TXT_API_KEY: ${{ secrets.POD2TXT_API_KEY }}
      run: |
        cd scripts
        echo "🔍 测试 OAuth 1.0 认证..."
        node generate-feed-oauth.js
        echo ""
        echo "🚀 生成正式 feed..."
        node generate-feed.js || true
    
    - name: Commit and push
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add feed-x.json feed-podcasts.json feed-blogs.json state-feed.json 2>/dev/null || true
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update feed $(date +%Y-%m-%d)" && git push) || echo "无更改"
