name: Generate Feed

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 6 * * *'  # 每天 6am UTC = 14:00 北京时间

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Generate feed
      env:
        X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        POD2TXT_API_KEY: ${{ secrets.POD2TXT_API_KEY }}
      run: |
        cd scripts
        node generate-feed.js || true
    
    - name: Commit and push if changed
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add feed-x.json feed-podcasts.json feed-blogs.json state-feed.json 2>/dev/null || true
        git diff --quiet && git diff --staged --quiet || git commit -m "Update feed $(date +%Y-%m-%d)"
        git push || true
